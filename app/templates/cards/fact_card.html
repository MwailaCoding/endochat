<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 48px;
            width: 1100px;
            height: 530px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .ribbon {
            position: absolute;
            top: 32px;
            right: 32px;
            width: 60px;
            height: 60px;
        }
        .ribbon svg {
            width: 100%;
            height: 100%;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }
        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 24px;
        }
        .brand {
            font-size: 24px;
            font-weight: 600;
            color: #92400E;
        }
        .title {
            font-size: 36px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 24px;
            line-height: 1.3;
        }
        .content {
            font-size: 28px;
            color: #374151;
            line-height: 1.6;
            flex: 1;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
            padding-top: 24px;
            border-top: 2px solid #FEF3C7;
        }
        .source {
            font-size: 16px;
            color: #6B7280;
            max-width: 60%;
        }
        .cta {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cta-text {
            font-size: 14px;
            color: #9CA3AF;
            text-align: right;
        }
        .url {
            font-size: 18px;
            color: #F59E0B;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="ribbon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10 C 35 30, 20 40, 30 60 C 35 70, 45 75, 50 90 C 55 75, 65 70, 70 60 C 80 40, 65 30, 50 10" fill="#F59E0B"/>
            </svg>
        </div>
        <div class="header">
            <div class="logo">E</div>
            <span class="brand">EndoChat</span>
        </div>
        <h1 class="title">{{title}}</h1>
        <p class="content">{{content}}</p>
        <div class="footer">
            <p class="source">{{source}}</p>
            <div class="cta">
                <div class="cta-text">
                    Learn more at<br>
                    <span class="url">endochat.org</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
